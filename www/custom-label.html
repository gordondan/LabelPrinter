<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Create Label</title>
    <link rel="stylesheet" href="/site.css">
    <link rel="stylesheet" href="/nav.css">
</head>
<body>
<script src="/nav.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', ()=> {
        window.renderSiteHeader();
    });
</script>

<div class="container">
    <form id="printForm">
        <div class="form-grid">
            <!-- Main Message -->
            <div class="form-group full-width">
                <label for="message">
                    Message
                    <button type="button" id="msgDateBtn" class="icon-btn" title="Add a date">📅</button>
                </label>
                <input type="text" id="message" name="message" placeholder="What's on the label?">
                <input type="date" id="msgDatePicker" style="display:none;" aria-hidden="true">
            </div>

            <!-- Quick toggles -->
            <div class="form-group full-width checkbox-row">
                <label>
                    <input type="checkbox" id="show_date" name="show_date" checked>
                    Today's Date
                </label>
                <label>
                    <input type="checkbox" id="border" name="border" checked>
                    Border
                </label>
            </div>

            <!-- Preview area -->
            <div class="form-group full-width">
                <div id="previewContainer">
                    <img id="previewImage" src="" alt="Label Preview">
                </div>
            </div>

            <!-- Status message -->
            <div id="statusMessage" class="full-width"></div>

            <!-- Print button -->
            <div class="form-group full-width">
                <button type="submit" id="submitButton" class="submit-btn" disabled>
                    Print Label <span class="nav-hotkey">(p)</span>
                </button>
            </div>

            <!-- Expandable Advanced Options -->
            <div class="full-width">
                <details>
                    <summary>More options</summary>
                    <div class="form-grid">
                        <!-- Border Messages -->
                        <div class="form-group">
                            <label for="border_message">
                                Top/Bottom Text
                                <button type="button" id="borderDateBtn" class="icon-btn" title="Add a date">📅</button>
                            </label>
                            <input type="text" id="border_message" name="border_message" placeholder="Repeating text">
                            <input type="date" id="borderDatePicker" style="display:none;" aria-hidden="true">
                        </div>
                        <div class="form-group">
                            <label for="side_border">
                                Side Text
                                <button type="button" id="sideDateBtn" class="icon-btn" title="Add a date">📅</button>
                            </label>
                            <input type="text" id="side_border" name="side_border" placeholder="Repeating text">
                            <input type="date" id="sideDatePicker" style="display:none;" aria-hidden="true">
                        </div>

                        <!-- Count -->
                        <div class="form-group">
                            <label for="count">Copies</label>
                            <input type="number" id="count" name="count" value="1" min="1" max="99">
                        </div>

                        <!-- Image Upload -->
                        <div class="form-group full-width">
                            <label>Image (optional)</label>
                            <label for="imageUpload" class="file-input-wrapper" id="fileInputWrapper">
                                <div>Tap to select an image</div>
                                <div id="fileName">No file chosen</div>
                            </label>
                            <input type="file" id="imageUpload" name="imageFile" accept="image/png, image/jpeg, image/gif" style="display:none;">
                            <div id="uploadPreviewContainer" style="display: none;">
                                <img id="uploadPreviewImage" src="#" alt="Selected image">
                                <button type="button" id="removeImageButton">Remove Image</button>
                            </div>
                        </div>
                    </div>
                </details>
            </div>
        </div>
    </form>
</div>

<script>
    // --- FORM ELEMENTS ---
    const printForm = document.getElementById('printForm');
    const submitButton = document.getElementById('submitButton');
    const statusMessage = document.getElementById('statusMessage');
    const previewImage = document.getElementById('previewImage');

    // --- IMAGE UPLOAD ELEMENTS ---
    const imageUploadInput = document.getElementById('imageUpload');
    const fileNameDisplay = document.getElementById('fileName');
    const fileInputWrapper = document.getElementById('fileInputWrapper');
    const uploadPreviewContainer = document.getElementById('uploadPreviewContainer');
    const uploadPreviewImage = document.getElementById('uploadPreviewImage');
    const removeImageButton = document.getElementById('removeImageButton');

    // --- STATE ---
    let debounceTimer = null;
    let previewReady = false;
    let lastPreviewPayload = null;
    let lastPreviewPath = null;
    let uploadedImagePath = null;
    let uploadedImageSig = null;

    function updatePrintButtonState() {
        submitButton.disabled = !previewReady;
    }

    function schedulePreviewDebounced() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(generatePreview, 1200);
    }

    function fileSignature(file) {
        return file ? `${file.name}:${file.size}:${file.lastModified}` : null;
    }

    async function ensureImageUploaded() {
        const file = imageUploadInput.files && imageUploadInput.files[0];
        const sig = fileSignature(file);
        if (!file) { uploadedImagePath = null; uploadedImageSig = null; return null; }
        if (uploadedImageSig === sig && uploadedImagePath) return uploadedImagePath;
        const imageUploadData = new FormData();
        imageUploadData.append('imageFile', file);
        const uploadResponse = await fetch('/api/upload', { method: 'POST', body: imageUploadData });
        const uploadResult = await uploadResponse.json().catch(() => ({ error: 'Invalid response' }));
        if (!uploadResponse.ok) throw new Error(uploadResult.error || 'Image upload failed.');
        uploadedImagePath = uploadResult.filePath;
        uploadedImageSig = sig;
        return uploadedImagePath;
    }

    function formatLongDate(dateStr) {
        try {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: '2-digit' });
        } catch { return dateStr; }
    }

    function buildPayload({ previewOnly }) {
        const printPayload = {};
        const formData = new FormData(printForm);
        const raw = {
            message: (formData.get('message') || '').toString(),
            border_message: (formData.get('border_message') || '').toString(),
            side_border: (formData.get('side_border') || '').toString(),
            count: (formData.get('count') || '').toString(),
        };

        if (raw.message.trim() !== '') printPayload.message = raw.message.trim();
        if (raw.border_message.trim() !== '') printPayload.border_message = raw.border_message.trim();
        if (raw.side_border.trim() !== '') printPayload.side_border = raw.side_border.trim();
        const countValue = parseInt(raw.count.trim()) || 1;
        printPayload.count = countValue;
        const borderEl = document.getElementById('border');
        printPayload.border = !!(borderEl && borderEl.checked);
        const showDateEl = document.getElementById('show_date');
        printPayload.show_date = !!(showDateEl && showDateEl.checked);
        if (uploadedImagePath) printPayload.image = uploadedImagePath;
        return printPayload;
    }

    async function pollForPreview(timeoutMs = 2000, intervalMs = 250) {
        const deadline = Date.now() + timeoutMs;
        while (Date.now() < deadline) {
            const testUrl = `/preview.png?ts=${Date.now()}`;
            try {
                await new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve();
                    img.onerror = reject;
                    img.src = testUrl;
                });
                return testUrl;
            } catch {}
            await new Promise(r => setTimeout(r, intervalMs));
        }
        return null;
    }

    async function generatePreview() {
        try {
            statusMessage.className = 'loading';
            statusMessage.textContent = 'Generating preview…';
            statusMessage.style.visibility = 'visible';
            previewReady = false;
            document.getElementById('previewContainer').classList.add('loading');
            updatePrintButtonState();
            await ensureImageUploaded();
            const payload = buildPayload({ previewOnly: true });
            const res = await fetch('/api/pi-label/preview', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const body = await res.json().catch(() => ({ error: 'Invalid response' }));
            if (!res.ok) throw new Error(body.errors ? body.errors.join(', ') : body.error || 'Preview failed.');
            let url = body.preview_url;
            lastPreviewPath = body.preview_path || null;
            if (!url) {
                url = await pollForPreview();
            }
            if (!url) throw new Error('No preview available.');
            previewImage.src = `${url}&t=${Date.now()}`;
            previewImage.style.display = 'block';
            previewReady = true;
            lastPreviewPayload = payload;
            statusMessage.style.visibility = 'hidden';
            statusMessage.className = '';
            document.getElementById('previewContainer').classList.remove('loading');
        } catch (err) {
            previewReady = false;
            lastPreviewPayload = null;
            lastPreviewPath = null;
            statusMessage.className = 'status-error';
            statusMessage.textContent = `Error: ${err.message}`;
            statusMessage.style.visibility = 'visible';
            previewImage.style.display = 'none';
        } finally {
            document.getElementById('previewContainer').classList.remove('loading');
            updatePrintButtonState();
        }
    }

    // --- EVENT LISTENER FOR FILE SELECTION ---
    imageUploadInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file && file.type.startsWith('image/')) {
            fileNameDisplay.textContent = file.name;
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadPreviewImage.src = e.target.result;
                uploadPreviewContainer.style.display = 'block';
                fileInputWrapper.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        schedulePreviewDebounced();
    });

    // --- EVENT LISTENER FOR REMOVE BUTTON ---
    removeImageButton.addEventListener('click', () => {
        imageUploadInput.value = '';
        uploadPreviewContainer.style.display = 'none';
        fileInputWrapper.style.display = 'block';
        fileNameDisplay.textContent = 'No file chosen';
        uploadedImagePath = null;
        uploadedImageSig = null;
        schedulePreviewDebounced();
    });

    // --- AUTOPREVIEW ON INPUT CHANGES ---
    printForm.addEventListener('input', (e) => {
        const target = e.target;
        if (!target || !(target instanceof HTMLElement)) return;
        const tag = target.tagName.toLowerCase();
        if (['border','show_date','date'].includes(target.id)) return;
        if (tag === 'input' || tag === 'textarea' || tag === 'select') {
            schedulePreviewDebounced();
        }
    });

    // Trigger preview immediately on border/show_date toggles (no debounce)
    document.getElementById('border').addEventListener('change', generatePreview);
    document.getElementById('show_date').addEventListener('change', generatePreview);

    // Calendar buttons
    function attachCalendarPair(fieldId, btnId, pickerId) {
        const field = document.getElementById(fieldId);
        const btn = document.getElementById(btnId);
        const picker = document.getElementById(pickerId);
        btn.addEventListener('click', () => picker.showPicker ? picker.showPicker() : picker.click());
        picker.addEventListener('change', () => {
            const v = (picker.value || '').trim();
            if (!v) return;
            const s = field.value || '';
            const pretty = formatLongDate(v);
            field.value = (s.length === 0 || /\s$/.test(s)) ? (s + pretty) : (s + ' ' + pretty);
            picker.value = '';
            generatePreview();
        });
    }
    attachCalendarPair('message', 'msgDateBtn', 'msgDatePicker');
    attachCalendarPair('border_message', 'borderDateBtn', 'borderDatePicker');
    attachCalendarPair('side_border', 'sideDateBtn', 'sideDatePicker');

    // --- EVENT LISTENER FOR PRINT SUBMISSION ---
    printForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!previewReady) { updateStatus('Generate a preview first.', 'error'); return; }

        submitButton.disabled = true;
        const originalText = submitButton.innerHTML;
        submitButton.innerHTML = 'Printing…';
        statusMessage.className = 'loading';
        statusMessage.textContent = 'Sending to printer…';
        statusMessage.style.visibility = 'visible';
        document.getElementById('previewContainer').classList.add('loading');

        try {
            const printPayload = lastPreviewPath ? { path: lastPreviewPath } : { ...(lastPreviewPayload || buildPayload({ previewOnly: false })) };
            if (!lastPreviewPath) {
                delete printPayload.preview_only;
                if (uploadedImagePath) printPayload.image = uploadedImagePath;
            }

            // Get selected printer
            const printerSelect = document.getElementById('printer-select');
            if (printerSelect && printerSelect.value) {
                printPayload.printer = printerSelect.value;
            }

            if (window.bumpJobsBadge) window.bumpJobsBadge();
            const printResponse = await fetch('/api/pi-label/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(printPayload)
            });
            const printResult = await printResponse.json().catch(() => ({ error: 'Invalid response' }));
            if (!printResponse.ok) {
                const errorMsg = printResult.errors ? printResult.errors.join(', ') : printResult.error;
                throw new Error(errorMsg || 'Print command failed.');
            }
            updateStatus('Label sent to printer!', 'success');
            if (printResult.preview_url) {
                previewImage.src = `${printResult.preview_url}&t=${Date.now()}`;
                previewImage.style.display = 'block';
            }
        } catch (error) {
            updateStatus(`Error: ${error.message}`, 'error');
        } finally {
            submitButton.innerHTML = originalText;
            updatePrintButtonState();
            statusMessage.className = '';
            document.getElementById('previewContainer').classList.remove('loading');
        }
    });

    function updateStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = type ? `status-${type}` : '';
        statusMessage.style.visibility = message ? 'visible' : 'hidden';
    }

    // Kick off an initial preview
    schedulePreviewDebounced();

    // Global hotkey: 'p' to print
    document.addEventListener('keydown', (ev) => {
        const t = ev.target;
        if (t && ((t.tagName === 'INPUT') || (t.tagName === 'TEXTAREA') || (t.isContentEditable))) return;
        if ((ev.key || '').toLowerCase() !== 'p') return;
        if (!previewReady) return;
        ev.preventDefault();
        submitButton.click();
    }, { passive: false });
</script>

</body>
</html>
