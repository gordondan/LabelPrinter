<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Label</title>
    <!-- Link to the external stylesheet -->
    <link rel="stylesheet" href="/site.css">
    <link rel="stylesheet" href="/nav.css">
</head>
<body>
<script src="/nav.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', ()=> {
        window.renderSiteHeader();
    });
</script>

    <div class="container">
        <form id="printForm">
            <div class="form-grid">
                <!-- Main Message -->
                <div class="form-group full-width">
                    <label for="message">Message</label>
                    <input type="text" id="message" name="message" placeholder="e.g., It's leftovers enjoy it!">
                </div>

                <!-- Border Messages -->
                <div class="form-group">
                    <label for="border_message">Top/Bottom Border Text</label>
                    <input type="text" id="border_message" name="border_message">
                </div>
                <div class="form-group">
                    <label for="side_border">Side Border Text</label>
                    <input type="text" id="side_border" name="side_border">
                </div>

                <!-- Count and Date -->
                <div class="form-group">
                    <label for="count">Count</label>
                    <input type="number" id="count" name="count" value="1" min="1">
                </div>
                <div class="form-group">
                    <label for="date">Date (optional)</label>
                    <input type="date" id="date" name="date">
                </div>

                <!-- Image Upload (Optional) -->
                <div class="form-group full-width">
                    <label>Image (optional)</label>
                    
                    <!-- This is the initial upload box -->
                    <label for="imageUpload" class="file-input-wrapper" id="fileInputWrapper">
                        <div>Click to select an image</div>
                        <div id="fileName">No file chosen</div>
                    </label>
                    <input type="file" id="imageUpload" name="imageFile" accept="image/png, image/jpeg, image/gif" style="display:none;">

                    <!-- This container will show the preview and remove button -->
                    <div id="uploadPreviewContainer" style="display: none;">
                        <img id="uploadPreviewImage" src="#" alt="Your selected image">
                        <button type="button" id="removeImageButton">Remove Image</button>
                    </div>
                </div>
                
                <!-- Boolean Flags -->
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="show_date" name="show_date">
                    <label for="show_date">Include Today's Date</label>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="preview_only" name="preview_only" checked>
                    <label for="preview_only">Preview Only (no printing)</label>
                </div>
            </div>

            <button type="submit" id="submitButton" class="submit-btn" disabled>Print Label</button>
        </form>

        <div id="statusMessage"></div>
        <div id="previewContainer">
            <img id="previewImage" src="" alt="Label Preview">
        </div>
    </div>

<script>
    // --- FORM ELEMENTS ---
    const printForm = document.getElementById('printForm');
    const submitButton = document.getElementById('submitButton');
    const statusMessage = document.getElementById('statusMessage');
    const previewImage = document.getElementById('previewImage');
    
    // --- IMAGE UPLOAD ELEMENTS ---
    const imageUploadInput = document.getElementById('imageUpload');
    const fileNameDisplay = document.getElementById('fileName');
    const fileInputWrapper = document.getElementById('fileInputWrapper');
    const uploadPreviewContainer = document.getElementById('uploadPreviewContainer');
    const uploadPreviewImage = document.getElementById('uploadPreviewImage');
    const removeImageButton = document.getElementById('removeImageButton');

    // --- STATE ---
    let debounceTimer = null;
    let previewReady = false;
    let lastPreviewPayload = null; // The payload used to create the preview
    let uploadedImagePath = null;
    let uploadedImageSig = null; // Track file identity to avoid re-uploads (name+size+mtime)

    function updatePrintButtonState() {
        const previewOnly = document.getElementById('preview_only').checked;
        submitButton.disabled = !(previewReady && !previewOnly);
    }

    function schedulePreviewDebounced() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(generatePreview, 3000);
    }

    function fileSignature(file) {
        return file ? `${file.name}:${file.size}:${file.lastModified}` : null;
    }

    async function ensureImageUploaded() {
        const file = imageUploadInput.files && imageUploadInput.files[0];
        const sig = fileSignature(file);
        if (!file) { uploadedImagePath = null; uploadedImageSig = null; return null; }
        if (uploadedImageSig === sig && uploadedImagePath) return uploadedImagePath;
        const imageUploadData = new FormData();
        imageUploadData.append('imageFile', file);
        const uploadResponse = await fetch('/api/upload', { method: 'POST', body: imageUploadData });
        const uploadResult = await uploadResponse.json().catch(() => ({ error: 'Invalid response' }));
        if (!uploadResponse.ok) throw new Error(uploadResult.error || 'Image upload failed.');
        uploadedImagePath = uploadResult.filePath;
        uploadedImageSig = sig;
        return uploadedImagePath;
    }

    function buildPayload({ previewOnly }) {
        const printPayload = {};
        const formData = new FormData(printForm);
        for (const [key, value] of formData.entries()) {
            if (key === 'imageFile') continue;
            if (key === 'show_date' || key === 'preview_only') {
                if (formData.get(key)) printPayload[key] = true;
                continue;
            }
            if (typeof value === 'string' && value.trim() !== '') {
                printPayload[key] = value;
            }
        }
        // Force preview_only flag as requested
        if (previewOnly) printPayload.preview_only = true; else delete printPayload.preview_only;
        if (uploadedImagePath) printPayload.image = uploadedImagePath;
        return printPayload;
    }

    async function generatePreview() {
        try {
            updateStatus('Generating preview…', 'success');
            // Ensure image is uploaded if present
            await ensureImageUploaded();
            const payload = buildPayload({ previewOnly: true });
            const res = await fetch('/api/pi-label/print', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const body = await res.json().catch(() => ({ error: 'Invalid response' }));
            if (!res.ok) throw new Error(body.errors ? body.errors.join(', ') : body.error || 'Preview failed.');
            if (!body.preview_url) throw new Error('No preview returned.');
            previewImage.src = `${body.preview_url}&t=${Date.now()}`;
            previewImage.style.display = 'block';
            previewReady = true;
            lastPreviewPayload = payload;
            updateStatus('Preview ready', 'success');
        } catch (err) {
            previewReady = false;
            lastPreviewPayload = null;
            updateStatus(`Error: ${err.message}`, 'error');
            previewImage.style.display = 'none';
        } finally {
            updatePrintButtonState();
        }
    }

    // --- EVENT LISTENER FOR FILE SELECTION ---
    imageUploadInput.addEventListener('change', (event) => {
        const file = event.target.files[0];

        if (file && file.type.startsWith('image/')) {
            fileNameDisplay.textContent = file.name;

            // Use FileReader to get the image data for preview
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadPreviewImage.src = e.target.result;
                // Show the preview and hide the upload box
                uploadPreviewContainer.style.display = 'block';
                fileInputWrapper.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
        // New image affects preview; schedule preview generation
        schedulePreviewDebounced();
    });

    // --- EVENT LISTENER FOR REMOVE BUTTON ---
    removeImageButton.addEventListener('click', () => {
        // Clear the file input
        imageUploadInput.value = ''; 
        
        // Hide the preview and show the upload box again
        uploadPreviewContainer.style.display = 'none';
        fileInputWrapper.style.display = 'block';
        
        // Reset the file name text
        fileNameDisplay.textContent = 'No file chosen';
    });

    // --- AUTOPREVIEW ON INPUT CHANGES ---
    // Track text/number/date inputs for debounced preview
    printForm.addEventListener('input', (e) => {
        const target = e.target;
        if (!target || !(target instanceof HTMLElement)) return;
        const tag = target.tagName.toLowerCase();
        if (tag === 'input' || tag === 'textarea' || tag === 'select') {
            schedulePreviewDebounced();
        }
    });

    // Immediate state reaction for preview_only checkbox
    document.getElementById('preview_only').addEventListener('change', updatePrintButtonState);

    // --- EVENT LISTENER FOR PRINT SUBMISSION ---
    printForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!previewReady) { updateStatus('Generate a preview first.', 'error'); return; }
        if (document.getElementById('preview_only').checked) { updateStatus('Uncheck Preview Only to print.', 'error'); return; }

        submitButton.disabled = true;
        const originalText = submitButton.textContent;
        submitButton.textContent = 'Printing…';

        try {
            // Reuse last preview payload but ensure preview_only is false
            const payload = { ...(lastPreviewPayload || buildPayload({ previewOnly: false })) };
            delete payload.preview_only;
            // Ensure image path is included if available
            if (uploadedImagePath) payload.image = uploadedImagePath;

            const printResponse = await fetch('/api/pi-label/print', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const printResult = await printResponse.json().catch(() => ({ error: 'Invalid response' }));
            if (!printResponse.ok) {
                const errorMsg = printResult.errors ? printResult.errors.join(', ') : printResult.error;
                throw new Error(errorMsg || 'Print command failed.');
            }
            updateStatus('Label sent to printer.', 'success');
            // Optionally refresh preview if provided
            if (printResult.preview_url) {
                previewImage.src = `${printResult.preview_url}&t=${Date.now()}`;
                previewImage.style.display = 'block';
            }
        } catch (error) {
            updateStatus(`Error: ${error.message}`, 'error');
        } finally {
            submitButton.textContent = originalText;
            updatePrintButtonState();
        }
    });

    function updateStatus(message, type) {
        statusMessage.textContent = message;
        statusMessage.className = `status-${type}`;
        statusMessage.style.display = 'block';
    }

    function resetButton() {
        // Not used in new flow; keep for compatibility
        updatePrintButtonState();
    }

    // Kick off an initial debounced preview on load (optional)
    schedulePreviewDebounced();
</script>

</body>
</html>
