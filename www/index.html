<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Label Printer</title>
    <link rel="stylesheet" href="/link-grid.css" />
    <link rel="stylesheet" href="/nav.css" />
</head>
<body>

    <div id="mount"></div>

    <script src="/nav.js"></script>
    <script src="/link-grid.js"></script>
    <script>
        // Configure the homepage link tiles here or fetch from an API/config.
        // Each item: { href, image_url, title }
        const HOME_LINKS = [
            { image_url: '/images/Today-Label.png', title: 'Today Label', action: 'print-today', disabled: true },
            { href: '/custom-label.html', image_url: '/images/Custom-Label.png', title: 'Custom Label' },
            { href: '/recent.html', image_url: '/images/Recent-Labels.png', title: 'Recent Labels' }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            window.renderSiteHeader();
            const mount = document.getElementById('mount');
            const grid = window.createLinkGrid({
                mount,
                getItems: async () => HOME_LINKS,
                cols: 4,
                rows: 2,
                onEnter: async (item) => {
                    if (item.href) { window.location.href = item.href; return; }
                    if (item.action === 'print-today') {
                        try {
                            grid.setBusy(item, true);
                            grid.setStatus('Printing today\'s date…');
                            // Use pre-generated today label
                            const statusRes = await fetch('/api/today/status');
                            const st = await statusRes.json().catch(()=>({ready:false}));
                            if (!st.ready || !st.rel_path) throw new Error('Today label not ready');
                            const selectedPrinter = document.getElementById('printer-select').value;
                            const printRes = await fetch('/api/pi-label/print', {
                                method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ path: st.rel_path, printer: selectedPrinter })
                            });
                            const printBody = await printRes.json().catch(()=>({error:'Invalid response'}));
                            if (!printRes.ok && !printBody.queued) throw new Error(printBody.errors ? printBody.errors.join(', ') : (printBody.error || 'Print failed'));
                            grid.setStatus('Label sent to printer.');
                        } catch (e) {
                            grid.setStatus('Error: ' + (e.message || e));
                        } finally {
                            grid.setBusy(item, false);
                        }
                        return;
                    }
                }
            });
            await grid.load();

            // Fetch today status, ensure generation in background if needed, and update the tile
            async function refreshTodayTile(){
                try {
                    const stRes = await fetch('/api/today/status');
                    const st = await stRes.json().catch(()=>({ready:false}));
                    const item = HOME_LINKS.find(x => x.action === 'print-today');
                    if (!item) return;
                    if (st.ready && st.rel_path){
                        item.image_url = `/preview/file?path=${encodeURIComponent(st.rel_path)}&ts=${Date.now()}`;
                        item.disabled = false;
                    } else {
                        // ask server to ensure it in background
                        fetch('/api/today/ensure', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ force: false }) }).catch(()=>{});
                        item.disabled = true;
                    }
                    grid.setItems(HOME_LINKS);
                } catch {}
            }
            refreshTodayTile();

            // Subscribe to server-sent events to handle GPIO-triggered actions
            try {
                const es = new EventSource('/api/events');
                es.onmessage = async (ev) => {
                    try {
                        const data = JSON.parse(ev.data || '{}');
                        if (data && data.type === 'print-today') {
                            const item = HOME_LINKS.find(x => x.action === 'print-today');
                            if (!item) return;
                            // Reuse pre-generated today label
                            try {
                                grid.setBusy(item, true);
                                grid.setStatus('Printing today\'s date…');
                                const statusRes = await fetch('/api/today/status');
                                const st = await statusRes.json().catch(()=>({ready:false}));
                                if (!st.ready || !st.rel_path) throw new Error('Today label not ready');
                                const selectedPrinter = document.getElementById('printer-select').value;
                                const printRes = await fetch('/api/pi-label/print', {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ path: st.rel_path, printer: selectedPrinter })
                                });
                                const printBody = await printRes.json().catch(()=>({error:'Invalid response'}));
                                if (!printRes.ok) throw new Error(printBody.errors ? printBody.errors.join(', ') : (printBody.error || 'Print failed'));
                                grid.setStatus('Label sent to printer.');
                            } catch (e) {
                                grid.setStatus('Error: ' + (e.message || e));
                            } finally {
                                grid.setBusy(item, false);
                            }
                        }
                    } catch {}
                };
            } catch {}
        });
    </script>

    </body>
    </html>
