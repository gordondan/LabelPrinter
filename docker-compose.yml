services:
  label-printer:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: label-printer-app
    ports:
      - "5000:5000"
    volumes:
      - ./config:/app/config
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./batches:/app/batches
    environment:
      - TZ=${TZ:-America/New_York}
    restart: unless-stopped
    # For Bluetooth access (needed for thermal printer)
    privileged: true

